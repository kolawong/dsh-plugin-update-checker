<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f293d" />
      <stop offset="100%" stop-color="#131b2e" />
    </linearGradient>

    <!-- Header Glow -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Accent Glow -->
    <radialGradient id="radialGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; fill: #94a3b8; }
    .code { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748b; font-weight: 500; }
    .val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #f8fafc; }
    .btn-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="520" fill="url(#bgGrad)" />
  <rect width="1200" height="520" fill="url(#radialGlow)" />

  <!-- Top Hero Heading -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="36" height="36" rx="8" fill="#1e3a8a" />
    <path d="M10 18a8 8 0 1 0 1.5-4.6M10 12v6h6" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="48" y="25" class="title" font-size="22">DeepSeek Harness — System &amp; Plugin Manager</text>
    <text x="48" y="44" class="subtitle" font-size="13">Core Upstream Release Tracking • Multi-Source Plugin Discovery • One-Click Lifecycle Control</text>
  </g>

  <!-- Main Card Container -->
  <g transform="translate(60, 115)" filter="url(#shadow)">
    <!-- Card Base -->
    <rect width="1080" height="360" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />

    <!-- Card Header Row -->
    <g transform="translate(24, 20)">
      <text x="0" y="16" class="title" font-size="16" fill="#f8fafc">系统与插件管理</text>
      <text x="0" y="34" class="subtitle" font-size="12" fill="#94a3b8">内核升级监控与扩展插件生命周期管理</text>

      <!-- Up to date Badge -->
      <rect x="890" y="4" width="96" height="26" rx="13" fill="#064e3b" fill-opacity="0.5" stroke="#059669" stroke-opacity="0.4" />
      <circle cx="906" cy="17" r="3.5" fill="#10b981" />
      <text x="918" y="21" class="btn-text" fill="#34d399">已是最新</text>

      <!-- Chevron -->
      <path d="M1010 13l5 5 5-5" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Horizontal Divider -->
    <line x1="24" y1="78" x2="1056" y2="78" stroke="#334155" stroke-width="1" />

    <!-- 4 Metric Cards Grid -->
    <g transform="translate(24, 94)">
      <!-- Metric 1: Current Version -->
      <g transform="translate(0, 0)">
        <rect width="245" height="58" rx="8" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" class="label">当前版本</text>
        <text x="14" y="42" class="val">0.1.0-rc.8</text>
        <rect x="86" y="28" width="80" height="18" rx="4" fill="#1e293b" />
        <text x="92" y="41" class="code" font-size="11" fill="#94a3b8">141eb6fef8</text>
      </g>

      <!-- Metric 2: Latest Version -->
      <g transform="translate(262, 0)">
        <rect width="245" height="58" rx="8" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" class="label">远程最新</text>
        <text x="14" y="42" class="val">v0.1.0-rc.8</text>
        <rect x="94" y="28" width="80" height="18" rx="4" fill="#1e293b" />
        <text x="100" y="41" class="code" font-size="11" fill="#94a3b8">141eb6fef8</text>
      </g>

      <!-- Metric 3: Status -->
      <g transform="translate(524, 0)">
        <rect width="245" height="58" rx="8" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" class="label">运行状态</text>
        <text x="14" y="42" class="val" fill="#10b981">0 (已对齐)</text>
      </g>

      <!-- Metric 4: Last Checked + Refresh -->
      <g transform="translate(786, 0)">
        <rect width="245" height="58" rx="8" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" class="label">上次检查</text>
        <text x="14" y="42" class="val" font-weight="500">18:13:25</text>
        
        <!-- Refresh Icon Button -->
        <rect x="206" y="15" width="28" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <path d="M216 29a4 4 0 1 0 .8-2.3M216 25v3h3" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <!-- Tab Bar -->
    <g transform="translate(24, 168)">
      <!-- Tab 1 Active -->
      <rect x="0" y="0" width="112" height="28" rx="6" fill="#1e3a8a" fill-opacity="0.5" />
      <path d="M12 11l4-2 4 2v4l-4 2-4-2v-4z" fill="none" stroke="#60a5fa" stroke-width="1.5" />
      <text x="26" y="18" class="btn-text" fill="#60a5fa">插件管理 (4)</text>

      <!-- Tab 2 Inactive -->
      <g transform="translate(120, 0)">
        <circle cx="12" cy="14" r="2.5" fill="#64748b" />
        <line x1="4" y1="14" x2="9" y2="14" stroke="#64748b" stroke-width="1.5" />
        <line x1="15" y1="14" x2="20" y2="14" stroke="#64748b" stroke-width="1.5" />
        <text x="26" y="18" class="btn-text" fill="#64748b">提交记录</text>
      </g>
    </g>

    <!-- Plugin List Container -->
    <g transform="translate(24, 206)">
      <rect width="1032" height="135" rx="8" fill="#090d16" fill-opacity="0.7" stroke="#1e293b" stroke-width="1" />

      <!-- Row 1: dsh-better-sidebar -->
      <g transform="translate(16, 12)">
        <text x="0" y="14" class="val" font-size="12">dsh-better-sidebar</text>
        <rect x="130" y="2" width="46" height="16" rx="3" fill="#1e293b" />
        <text x="135" y="14" class="code" font-size="10" fill="#94a3b8">0.14.0</text>
        <text x="0" y="28" class="subtitle" font-size="11" fill="#64748b">VSCode-like right sidebar for workspace tools &amp; file explorer</text>

        <!-- Actions -->
        <rect x="880" y="4" width="56" height="22" rx="4" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="0.8" />
        <text x="893" y="19" class="btn-text" fill="#10b981">已启用</text>
        <rect x="944" y="4" width="56" height="22" rx="4" fill="#450a0a" fill-opacity="0.4" stroke="#dc2626" stroke-width="0.8" />
        <text x="957" y="19" class="btn-text" fill="#ef4444">卸载</text>
      </g>

      <line x1="16" y1="46" x2="1016" y2="46" stroke="#1e293b" stroke-width="1" />

      <!-- Row 2: dsh-plugin-auth-webserver -->
      <g transform="translate(16, 56)">
        <text x="0" y="14" class="val" font-size="12">dsh-plugin-auth-webserver</text>
        <rect x="175" y="2" width="40" height="16" rx="3" fill="#1e293b" />
        <text x="180" y="14" class="code" font-size="10" fill="#94a3b8">0.3.0</text>
        <text x="0" y="28" class="subtitle" font-size="11" fill="#64748b">HTTP Basic &amp; session authentication, login page and settings card</text>

        <!-- Actions -->
        <rect x="880" y="4" width="56" height="22" rx="4" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="0.8" />
        <text x="893" y="19" class="btn-text" fill="#10b981">已启用</text>
        <rect x="944" y="4" width="56" height="22" rx="4" fill="#450a0a" fill-opacity="0.4" stroke="#dc2626" stroke-width="0.8" />
        <text x="957" y="19" class="btn-text" fill="#ef4444">卸载</text>
      </g>

      <line x1="16" y1="90" x2="1016" y2="90" stroke="#1e293b" stroke-width="1" />

      <!-- Row 3: @custom/dsh-plugin-j-space -->
      <g transform="translate(16, 100)">
        <text x="0" y="14" class="val" font-size="12" fill="#94a3b8">@custom/dsh-plugin-j-space</text>
        <rect x="188" y="2" width="70" height="16" rx="3" fill="#1e3a8a" fill-opacity="0.4" />
        <text x="193" y="14" class="btn-text" font-size="10" fill="#60a5fa">本地工作区</text>
        <rect x="264" y="2" width="40" height="16" rx="3" fill="#1e293b" />
        <text x="269" y="14" class="code" font-size="10" fill="#94a3b8">3.6.0</text>

        <!-- Actions -->
        <rect x="880" y="4" width="56" height="22" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
        <text x="893" y="19" class="btn-text" fill="#94a3b8">已停用</text>
        <rect x="944" y="4" width="56" height="22" rx="4" fill="#450a0a" fill-opacity="0.4" stroke="#dc2626" stroke-width="0.8" />
        <text x="957" y="19" class="btn-text" fill="#ef4444">卸载</text>
      </g>
    </g>
  </g>
</svg>
